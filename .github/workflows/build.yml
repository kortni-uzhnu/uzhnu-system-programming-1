name: Build and test the assembly labs

on:
  workflow_dispatch:
  push:
    paths:
      - 'lab_*.asm'
      - 'verify.py'
      - 'build_remote.py'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  windows:
    if: github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Assemble, link and test
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          python build_remote.py
